# Video Generation Configuration
# Choose your preferred backend

# Available backends:
# - cogvideox: High quality text-to-video (recommended)
# - stable_video: Image-to-video generation
# - animatediff: Text-to-video animation

backend: cogvideox

# Output settings
output:
  directory: ./output
  format: mp4
  fps: 8
  quality: 8  # CRF value (lower = better quality)

# CogVideoX settings
cogvideox:
  model: THUDM/CogVideoX-2b
  dtype: float16
  max_tokens: 200

# Stable Video settings
stable_video:
  model: stabilityai/stable-video-diffusion-img2vid-xt
  fps: 6
  motion_bucket_id: 127
  noise_aug_strength: 0.02

# AnimateDiff settings
animatediff:
  model: lyoghrh/animatediff-motion-adapter-v1-5-3
  scheduler: euler_ancestral
  num_inference_steps: 25
  guidance_scale: 7.5

# Generation defaults
generation:
  width: 480
  height: 480
  num_frames: 49
  seed: -1  # -1 for random
